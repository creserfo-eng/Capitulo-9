<!DOCTYPE html>
<!-- Ejercicio 9.19 -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Números Primos</title>
      <script>
         function esPrimo(n) {
            if (n <= 1) return false;
            var limite = Math.sqrt(n);
            for (var i = 2; i <= limite; ++i) {
               if (n % i === 0) return false;
            }
            return true;
         }

         function buscarPrimos() {
            var texto = "";
            for (var i = 1; i <= 10000; ++i) {
               if (esPrimo(i)) {
                  texto += i + " ";
               }
            }
            document.getElementById("txtPrimos").value = texto;
         }

         window.addEventListener("load", buscarPrimos, false);
      </script>
   </head>
   <body>
      <h2>Primos del 1 al 10,000</h2>
      <textarea id="txtPrimos" rows="15" cols="50"></textarea>
   </body>
</html>
