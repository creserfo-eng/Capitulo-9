<!DOCTYPE html>
<!-- Ejercicio 9.29 -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Potencia Recursiva</title>
      <script>
         function potencia(base, exponente) {
            if (exponente === 1) {
               return base;
            } else {
               return base * potencia(base, exponente - 1);
            }
         }

         function calcular() {
            var b = parseInt(document.getElementById("base").value);
            var e = parseInt(document.getElementById("exponente").value);
            var res = potencia(b, e);
            document.getElementById("resultado").innerHTML = "Resultado: " + res;
         }

         function iniciar() {
            document.getElementById("btn").addEventListener("click", calcular, false);
         }
         window.addEventListener("load", iniciar, false);
      </script>
   </head>
   <body>
      <form action="#">
         Base: <input id="base" type="text"> Exponente: <input id="exponente" type="text">
         <input id="btn" type="button" value="Calcular">
      </form>
      <p id="resultado"></p>
   </body>
</html>
