<!DOCTYPE html>
<!-- Ejercicio 9.13 -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Potencia Entera</title>
      <script>
         function potenciaEntera(base, exponente) {
            var resultado = 1;
            for (var i = 1; i <= exponente; ++i) {
               resultado *= base;
            }
            return resultado;
         }

         function calcular() {
            var b = parseInt(document.getElementById("base").value);
            var e = parseInt(document.getElementById("exp").value);
            var res = potenciaEntera(b, e);
            document.getElementById("resultado").innerHTML = b + " elevado a " + e + " es: " + res;
         }

         function iniciar() {
            document.getElementById("btn").addEventListener("click", calcular, false);
         }
         window.addEventListener("load", iniciar, false);
      </script>
   </head>
   <body>
      <form action="#">
         Base: <input id="base" type="text"> Exponente: <input id="exp" type="text">
         <input id="btn" type="button" value="Calcular Potencia">
      </form>
      <p id="resultado"></p>
   </body>
</html>
